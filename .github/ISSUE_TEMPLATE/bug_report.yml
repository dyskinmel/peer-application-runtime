name: Bug report
description: Report a reproducible non-sensitive defect.
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include credentials, private keys, sensitive security details, or personal data."
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal commands or fixture using synthetic/non-sensitive data.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS/runtime/tool versions. Redact local paths and identities.
